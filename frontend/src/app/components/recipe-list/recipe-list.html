<h2 class="title">Recipes</h2>
<div class="actions">
  @if (auth.isLoggedIn()) {
    <a routerLink="/recipes/create" class="create-btn">+ Create New Recipe</a>
  }
</div>

<div class="recipe-list">
  @for (r of recipes(); track r._id) {
    <div class="recipe-card" (click)="viewRecipe(r._id)">
      <img [src]="r.imageUrl" alt="{{ r.title }}" class="recipe-image" />
      <div class="recipe-content">
        <h3>{{ r.title }}</h3>
        <p>{{ r.description }}</p>


        @if (auth.isLoggedIn()) {
          <div class="buttons">
            <button type="button" (click)="editRecipe(r._id); $event.stopPropagation()" class="edit-btn">Edit</button>
            <button type="button" (click)="deleteRecipe(r._id); $event.stopPropagation()" class="delete-btn">Delete</button>
          </div>
        }
      </div>
    </div>
  } @empty {
    <p class="empty">No recipes found.</p>
  }
</div>
